name: Run backtest

on:
  push:
    branches: [main]
    paths-ignore: ["results/**", "visuals/**", "data/**"]
  schedule:
    - cron: "17 22 * * 0"   # weekly refresh of prices, Sunday evening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt nbconvert ipykernel
      - name: Run tests
        run: python -m pytest -q
      - name: Download data and run the research pipeline
        run: python main.py --refresh-data
      - name: Execute the walkthrough notebook
        run: jupyter nbconvert --to notebook --execute --inplace notebooks/strategy_walkthrough.ipynb
      - name: Commit data, results, charts and notebook outputs
        run: |
          git config user.name "Jeremiah"
          git config user.email "jeremiahj.johnson@yahoo.com"
          git add data results visuals notebooks README.md
          git diff --cached --quiet || git commit -m "Update data, results, charts and notebook outputs [skip ci]"
          git push
